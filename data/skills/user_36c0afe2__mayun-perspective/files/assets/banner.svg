<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#131A33"/>
      <stop offset="100%" stop-color="#1B1230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFB45C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- 网格：秩序感 -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- 节点连线：象征 7 个心智模型的连接结构 -->
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 840 240 L 900 170 L 975 205 L 1050 130"/>
    <path d="M 840 240 L 900 290 L 975 250 L 1050 300"/>
    <path d="M 900 170 L 975 250"/>
    <path d="M 900 290 L 975 205"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="840" cy="240" r="7"/>
    <circle cx="900" cy="170" r="6"/>
    <circle cx="900" cy="290" r="6"/>
    <circle cx="975" cy="205" r="6"/>
    <circle cx="975" cy="250" r="6"/>
    <circle cx="1050" cy="130" r="8"/>
    <circle cx="1050" cy="300" r="8"/>
  </g>

  <!-- 左侧主标 -->
  <rect x="72" y="52" width="4" height="86" rx="2" fill="url(#accent)"/>

  <text x="98" y="98" fill="#FFFFFF" font-size="52" font-weight="700" letter-spacing="1">
    马云 · 思维操作系统
  </text>

  <text x="100" y="140" fill="#FFB45C" font-size="22" letter-spacing="6">
    JACK MA MENTAL OPERATING SYSTEM
  </text>

  <text x="100" y="196" fill="#C9D2E8" font-size="21">
    7 个心智模型 · 10 条决策启发式 · 22,228 字语料量化的表达 DNA
  </text>

  <text x="100" y="236" fill="#8B96B4" font-size="18">
    每个模型都带三样东西：证据、用法、失效条件
  </text>

  <!-- 分隔线 -->
  <line x1="98" y1="272" x2="700" y2="272" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 底部三个标签 -->
  <g>
    <rect x="98" y="296" width="132" height="34" rx="17" fill="none" stroke="#FF8A00" stroke-opacity="0.6"/>
    <text x="164" y="318" fill="#FFB45C" font-size="15" text-anchor="middle">会忠实沉默</text>

    <rect x="244" y="296" width="164" height="34" rx="17" fill="none" stroke="#FF8A00" stroke-opacity="0.6"/>
    <text x="326" y="318" fill="#FFB45C" font-size="15" text-anchor="middle">6 对张力不调和</text>

    <rect x="422" y="296" width="150" height="34" rx="17" fill="none" stroke="#FF8A00" stroke-opacity="0.6"/>
    <text x="497" y="318" fill="#FFB45C" font-size="15" text-anchor="middle">免费 · 非商业</text>
  </g>

  <!-- 右下角署名 -->
  <text x="1128" y="368" fill="#5C6785" font-size="15" text-anchor="end">
    赵国强 蒸馏 · v1.0.0
  </text>
</svg>
