<svg viewBox="0 0 680 520" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>医药流通ERP证照管控 关系图</title>
  <desc>证照管控与经营范围管控两层关系；主体×级别持有证照并关联经营范围/品种集合/具体品种；证照过期触发停用与业务阻断。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { font-weight:700; fill:#FFFFFF; }
      .ts { font-weight:400; fill:#C9D1D9; }
      .c-teal  { fill:#0E3B3B; stroke:#2DD4BF; }
      .c-blue  { fill:#0E2A47; stroke:#58A6FF; }
      .c-gray  { fill:#21262D; stroke:#8B949E; }
      .c-red   { fill:#3B1414; stroke:#FF6B6B; }
      .c-coral { fill:#4A1D1D; stroke:#FF8787; }
      .c-green { fill:#14361A; stroke:#56D364; }
      text { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="520" fill="#0D1117"/>

  <text class="th" x="60" y="32" font-size="13" fill="#7EE0D2">两套互补 Skill</text>
  <rect class="c-teal" x="60" y="42" width="200" height="54" rx="10" stroke-width="1"/>
  <text class="th" x="160" y="64" text-anchor="middle" dominant-baseline="central">经营范围管控 Skill</text>
  <text class="ts" x="160" y="84" text-anchor="middle" dominant-baseline="central">结论层 · 范围层</text>

  <rect class="c-blue" x="420" y="42" width="200" height="54" rx="10" stroke-width="1"/>
  <text class="th" x="520" y="64" text-anchor="middle" dominant-baseline="central">证照管控 Skill</text>
  <text class="ts" x="520" y="84" text-anchor="middle" dominant-baseline="central">证据层 · 时效层</text>

  <line x1="262" y1="69" x2="416" y2="69" stroke="#C9D1D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="339" y="61" text-anchor="middle" fill="#C9D1D9">证据 ⇄ 结论</text>

  <text class="th" x="40" y="136" font-size="12" fill="#FFFFFF">主体（三类）</text>
  <text class="th" x="255" y="136" font-size="12" fill="#FFFFFF">证照字典（三大类）</text>
  <text class="th" x="490" y="136" font-size="12" fill="#FFFFFF">维护关联（三级粒度）</text>

  <rect class="c-blue" x="40" y="148" width="150" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="115" y="171" text-anchor="middle" dominant-baseline="central">供应商</text>
  <rect class="c-blue" x="40" y="208" width="150" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="115" y="231" text-anchor="middle" dominant-baseline="central">客户</text>
  <rect class="c-blue" x="40" y="268" width="150" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="115" y="291" text-anchor="middle" dominant-baseline="central">仓库</text>

  <rect class="c-blue" x="255" y="148" width="175" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="342" y="171" text-anchor="middle" dominant-baseline="central">主体资质类</text>
  <rect class="c-blue" x="255" y="208" width="175" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="342" y="231" text-anchor="middle" dominant-baseline="central">特殊品种许可类</text>
  <rect class="c-blue" x="255" y="268" width="175" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="342" y="291" text-anchor="middle" dominant-baseline="central">仓储设施类</text>

  <rect class="c-teal" x="490" y="148" width="160" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="570" y="171" text-anchor="middle" dominant-baseline="central">经营范围 2.1</text>
  <rect class="c-teal" x="490" y="208" width="160" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="570" y="231" text-anchor="middle" dominant-baseline="central">品种集合 2.2</text>
  <rect class="c-teal" x="490" y="268" width="160" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="570" y="291" text-anchor="middle" dominant-baseline="central">具体品种 2.3</text>

  <line x1="190" y1="245" x2="253" y2="245" stroke="#58A6FF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="221" y="237" text-anchor="middle" fill="#58A6FF">持有</text>

  <line x1="430" y1="171" x2="488" y2="171" stroke="#2DD4BF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="231" x2="488" y2="231" stroke="#2DD4BF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="291" x2="488" y2="291" stroke="#2DD4BF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="342" y="332" text-anchor="middle" fill="#C9D1D9">三级证照：基础证照 / 品类证照 / 具体品种证照（9 格规则矩阵）</text>

  <text class="th" x="60" y="366" font-size="13" fill="#FF8787">证照过期阻断闭环</text>

  <rect class="c-gray" x="60" y="378" width="150" height="50" rx="8" stroke-width="1"/>
  <text class="th" x="135" y="398" text-anchor="middle" dominant-baseline="central">证照有效判定</text>
  <text class="ts" x="135" y="416" text-anchor="middle" dominant-baseline="central">有效期 + 状态</text>

  <rect class="c-red" x="250" y="378" width="165" height="50" rx="8" stroke-width="1"/>
  <text class="th" x="332" y="398" text-anchor="middle" dominant-baseline="central">过期 → 停用</text>
  <text class="ts" x="332" y="416" text-anchor="middle" dominant-baseline="central">范围/集合/品种失效</text>

  <rect class="c-coral" x="470" y="378" width="160" height="50" rx="8" stroke-width="1"/>
  <text class="th" x="550" y="398" text-anchor="middle" dominant-baseline="central">业务拦截</text>
  <text class="ts" x="550" y="416" text-anchor="middle" dominant-baseline="central">采购/销售/入库</text>

  <line x1="210" y1="403" x2="248" y2="403" stroke="#C9D1D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="403" x2="468" y2="403" stroke="#C9D1D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="441" y="395" text-anchor="middle" fill="#C9D1D9">阻断</text>

  <rect class="c-green" x="250" y="450" width="165" height="46" rx="8" stroke-width="1"/>
  <text class="th" x="332" y="470" text-anchor="middle" dominant-baseline="central">续期 / 换新证</text>
  <text class="ts" x="332" y="487" text-anchor="middle" dominant-baseline="central">重新激活 · 免重挂</text>

  <path d="M 332 450 C 332 430, 135 430, 135 428" fill="none" stroke="#56D364" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="ts" x="225" y="422" text-anchor="middle" fill="#56D364">恢复有效</text>
</svg>
