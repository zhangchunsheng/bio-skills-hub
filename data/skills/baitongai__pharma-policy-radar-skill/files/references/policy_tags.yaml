# 医药政策雷达 — 政策标签体系

# ===== 机构类别 =====
agency_types:
  - 药监        # 药品监督管理局
  - 医保        # 医疗保障局
  - 中医药      # 中医药管理局
  - 卫健委      # 卫生健康委员会

# ===== 地域层级 =====
geo_levels:
  - 国家级      # 国务院部委/直属机构发布
  - 省级        # 省/自治区/直辖市发布
  - 市级        # 地级市/副省级城市发布

# ===== 政策类型 =====
policy_types:
  - id: "法规"
    label: "法规"
    description: "具有法律约束力的规范性文件"
    keywords: ["令", "条例", "办法", "规定"]
  - id: "通知"
    label: "通知"
    description: "行政通知、工作部署类文件"
    keywords: ["通知", "公告"]
  - id: "指南"
    label: "指南"
    description: "指导原则、技术指南"
    keywords: ["指南", "指导原则", "技术规范"]
  - id: "征求意见稿"
    label: "征求意见稿"
    description: "公开征求意见的草案文件"
    keywords: ["征求意见", "公开征求", "草案"]
  - id: "公告"
    label: "公告"
    description: "法定公告类文件"
    keywords: ["公告", "通告"]

# ===== 影响领域 =====
impact_domains:
  - id: "准入"
    label: "准入"
    description: "药品注册、医保目录准入、市场准入"
    keywords: ["注册", "审评审批", "医保目录", "市场准入"]
  - id: "定价"
    label: "定价"
    description: "药品价格管理、集采价格"
    keywords: ["价格", "集采", "带量采购", "价格联动"]
  - id: "合规"
    label: "合规"
    description: "GMP/GSP合规、飞行检查、药物警戒"
    keywords: ["GMP", "GSP", "飞行检查", "合规", "召回", "药物警戒"]
  - id: "研发"
    label: "研发"
    description: "临床试验、创新药研发政策"
    keywords: ["临床试验", "创新药", "仿制药", "生物制品"]
  - id: "生产"
    label: "生产"
    description: "药品生产许可、委托生产"
    keywords: ["生产许可", "委托生产", "车间", "工艺核查"]
  - id: "流通"
    label: "流通"
    description: "药品流通监管、追溯体系"
    keywords: ["流通", "追溯", "配送", "互联网"]
  - id: "使用"
    label: "使用"
    description: "临床使用、处方管理"
    keywords: ["处方", "临床路径", "合理用药", "基本药物"]

# ===== 紧急程度 =====
urgency_rules:
  高:
    indicators:
      - "立即生效"
      - "含明确截止日期且 < 30天"
      - "涉及产品注册或医保准入变动"
      - "飞行检查/抽检不合格/责令整改"
    icon: "🔴"
  中:
    indicators:
      - "征求意见稿(有反馈截止日)"
      - "过渡期政策"
      - "试点方案"
      - "需企业30日内响应"
    icon: "🟡"
  低:
    indicators:
      - "长期规划(≥1年)"
      - "无明确时间节点"
      - "原则性指导意见"
      - "研究/调研类通知"
    icon: "🟢"
