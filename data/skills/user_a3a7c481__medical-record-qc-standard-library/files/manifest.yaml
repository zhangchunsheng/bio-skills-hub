# manifest.yaml — 技能市场发布清单
# 发布到 SkillHub 时，可直接将本文件内容填入提交表单。
# 发布前请补全 author.name 与 author.email（必填）。

skill:
  # 技能名称（不超过 20 字）
  name: 病历质控

  # slug：小写+连字符，作为市场 URL 标识，发布后不可随意变更
  slug: medical-record-qc-standard-library

  # 语义化版本号（semver），每次更新递增
  version: 1.0.0

  # 分类标签（市场橱窗分类）
  category: 医疗健康

  # 图标（512×512 PNG）
  icon: assets/icon.png

  # 作者信息（发布前必填）
  author:
    name: "胖大夫"          # 作者/机构名称
    email: "87217397@qq.com" # 联系邮箱
    url: ""           # 可选：主页/主页链接

  # 一句话描述（市场卡片展示，100–300 字）
  description: |
    基于「庆安病历质控」知识库蒸馏的黑龙江省病历质控标准速查库，
    覆盖 23 份官方规范/标准，支持病历甲/乙/丙级评定、24 条单项否决判定、
    住院/门诊病案检查、病案首页填写与主要诊断/手术选择、
    27 个质控指标（MER 系列）、书写核心时限、死亡病案评估与真实性认定。

  # 分类/搜索标签
  tags:
    - 病历质控
    - 病历分级评定
    - 病案首页
    - 主要诊断选择
    - 质控指标
    - 死亡病案评估
    - 病历真实性
    - 黑龙江省

  # 触发词（用户提到这些词时技能应被激活）
  triggers:
    - 病历质控
    - 缺陷认定
    - 病历分级评定
    - 甲级病历
    - 乙级病历
    - 丙级病历
    - 单项否决
    - 病案首页填写
    - 主要诊断选择
    - 主要手术选择
    - 质控指标
    - 死亡病案评估
    - 病历真实性
    - 伪造篡改认定
    - 整改建议

  # 权限声明（本技能为纯知识库技能，不申请任何敏感权限）
  permissions: []

  # 合规声明
  compliance:
    # 医学/法规结论须附官方依据文号
    medical_basis_required: true
    # 主要依据文件（文号/来源）
    sources:
      - 黑龙江省病历书写规范（2023 年版）｜黑卫医发〔2023〕60 号
      - 住院病案首页数据填写质量规范（暂行）｜国卫办医发〔2016〕24 号
      - 卫生部关于修订住院病案首页的通知｜卫医政发〔2011〕84 号
      - 电子病历应用管理规范（试行）｜国卫办医发〔2017〕8 号
      - 病案管理质量控制指标（2021 年版）｜国卫办医函〔2021〕192 号
      - 关于病历真实性的专家共识｜中国政法大学证据科学研究院等

  # 使用说明（可选但推荐）
  usage: |
    在对话中提及"病历质控 / 病历分级 / 甲级病历 / 病案首页填写 / 主要诊断选择 /
    质控指标 / 死亡病案评估 / 病历真实性"等关键词即可触发。
    所有医学/法规结论会自动附官方依据文号，不臆造标准条文。
