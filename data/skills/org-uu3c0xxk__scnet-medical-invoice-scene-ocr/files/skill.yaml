name: medical_invoice_scene_ocr
version: 1.0.0
description: 支持医疗报销场景的票据识别，包括医疗住院发票和医疗费用结算单。用户必须明确指定本地文件路径并确认需要上传至 Scnet OCR API 后，方可触发本技能。
author: SCNet
license: MIT
tags:
  - ocr
  - 文字提取
  - 医疗报销场景
  - 医疗住院发票
  - 医疗费用结算单
  - 医疗报销场景票据识别

required_env_vars:
  - SCNET_API_KEY

optional_env_vars:
  - SCNET_API_BASE

primary_credential: SCNET_API_KEY

# 增加项目主页，解决 missing homepage 警告
homepage: https://github.com/SCNet-sugon/medical_invoice_scene_ocr.git  # 请替换为实际仓库地址
dependencies:
  - python3
  - requests