<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__SONG_TITLE__ - Audio Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.player{width:100%;max-width:860px;background:#161b22;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.header{padding:24px 28px 16px;border-bottom:1px solid #30363d}
.header h1{font-size:22px;font-weight:600;color:#e6edf3;margin-bottom:6px}
.meta{font-size:13px;color:#8b949e;display:flex;gap:16px;flex-wrap:wrap}
.meta span{display:flex;align-items:center;gap:4px}
.meta .tag{background:#21262d;padding:2px 10px;border-radius:12px;font-size:12px}
.canvas-wrap{position:relative;background:#0d1117;padding:16px}
#pianoRoll{width:100%;height:200px;display:block;border-radius:8px;background:#010409}
.section-label{position:absolute;top:24px;left:28px;font-size:11px;color:#58a6ff;background:rgba(56,139,253,0.15);padding:2px 10px;border-radius:10px;pointer-events:none}
.lyrics{padding:20px 28px;min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;border-top:1px solid #30363d}
.lyric-line{font-size:15px;line-height:1.8;transition:all 0.3s ease;text-align:center;max-width:600px}
.lyric-current{color:#e6edf3;font-size:17px;font-weight:500}
.lyric-near{color:#8b949e}
.lyric-far{color:#484f58;font-size:13px}
.controls{padding:16px 28px;border-top:1px solid #30363d;display:flex;align-items:center;gap:16px}
.btn{background:#21262d;border:1px solid #30363d;color:#e6edf3;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.15s}
.btn:hover{background:#30363d;border-color:#8b949e}
.btn:active{transform:scale(0.95)}
.btn-play{background:#238636;border-color:#238636;color:#fff}
.btn-play:hover{background:#2ea043;border-color:#2ea043}
.seek-wrap{flex:1;display:flex;align-items:center;gap:10px}
#seekBar{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:#21262d;border-radius:2px;cursor:pointer;outline:none}
#seekBar::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#58a6ff;border-radius:50%;cursor:pointer}
#seekBar::-moz-range-thumb{width:14px;height:14px;background:#58a6ff;border-radius:50%;cursor:pointer;border:none}
.time{font-size:12px;color:#8b949e;font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.sections-nav{padding:12px 28px;border-top:1px solid #30363d;display:flex;gap:8px;flex-wrap:wrap}
.section-btn{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:4px 14px;border-radius:14px;font-size:12px;cursor:pointer;transition:all 0.15s}
.section-btn:hover{background:#30363d;color:#e6edf3}
.section-btn.active{background:rgba(56,139,253,0.2);border-color:#58a6ff;color:#58a6ff}
.footer{padding:12px 28px;border-top:1px solid #30363d;font-size:11px;color:#484f58;text-align:center}
.footer a{color:#58a6ff;text-decoration:none}
</style>
</head>
<body>
<div class="player">
  <div class="header">
    <h1>__SONG_TITLE__</h1>
    <div class="meta">
      <span class="tag">Key: __KEY_DISPLAY__</span>
      <span class="tag">BPM: __BPM__</span>
      <span class="tag">Genre: __GENRE_DISPLAY__</span>
    </div>
  </div>
  <div class="canvas-wrap">
    <div class="section-label" id="sectionLabel">Verse 1</div>
    <canvas id="pianoRoll"></canvas>
  </div>
  <div class="lyrics" id="lyricsDisplay">
    <div class="lyric-line lyric-far">Click play to start</div>
  </div>
  <div class="controls">
    <button class="btn btn-play" id="playBtn" title="Play/Pause">&#9654;</button>
    <button class="btn" id="stopBtn" title="Stop">&#9632;</button>
    <div class="seek-wrap">
      <input type="range" id="seekBar" min="0" max="1000" value="0" step="1">
      <span class="time" id="timeDisplay">0:00 / 0:00</span>
    </div>
  </div>
  <div class="sections-nav" id="sectionsNav"></div>
  <div class="footer">
    AI词曲创作引擎 V2.4 - 结构参考级 Demo | Web Audio API 合成 | 非成品音频
  </div>
</div>

<script>
const DATA = __PLAYBACK_DATA__;

// ==================== Audio Engine ====================
let audioCtx = null;
let isPlaying = false;
let startTime = 0;
let pauseOffset = 0;
let scheduledNodes = [];
let schedulerTimer = null;
let eventIndex = 0;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function playChord(notes, time, duration) {
  notes.forEach(note => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = midiToFreq(note);
    const peak = 0.06;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(peak, time + 0.02);
    gain.gain.linearRampToValueAtTime(peak * 0.6, time + 0.15);
    gain.gain.setValueAtTime(peak * 0.6, time + duration - 0.15);
    gain.gain.linearRampToValueAtTime(0, time + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + duration + 0.05);
    scheduledNodes.push(osc);
  });
}

function playMelody(note, time, duration) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.value = midiToFreq(note);
  const peak = 0.12;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(peak, time + 0.01);
  gain.gain.linearRampToValueAtTime(peak * 0.5, time + 0.1);
  gain.gain.linearRampToValueAtTime(0, time + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + duration + 0.05);
  scheduledNodes.push(osc);
}

function playBass(note, time, duration) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = midiToFreq(note);
  const peak = 0.15;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(peak, time + 0.02);
  gain.gain.linearRampToValueAtTime(peak * 0.4, time + 0.2);
  gain.gain.linearRampToValueAtTime(0, time + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + duration + 0.05);
  scheduledNodes.push(osc);
}

function playKick(time) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(120, time);
  osc.frequency.exponentialRampToValueAtTime(40, time + 0.08);
  gain.gain.setValueAtTime(0.4, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.15);
  scheduledNodes.push(osc);
}

function playSnare(time) {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 1500;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.25, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(time);
  src.stop(time + 0.1);
  scheduledNodes.push(src);
}

function playHihat(time) {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.03, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 8000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.08, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.02);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(time);
  src.stop(time + 0.03);
  scheduledNodes.push(src);
}

function scheduleEvent(event, time) {
  switch (event.type) {
    case "chord": playChord(event.notes, time, event.duration); break;
    case "melody": playMelody(event.note, time, event.duration); break;
    case "bass": playBass(event.note, time, event.duration); break;
    case "kick": playKick(time); break;
    case "snare": playSnare(time); break;
    case "hihat": playHihat(time); break;
  }
}

// ==================== Scheduler ====================
const LOOK_AHEAD = 0.1;
const SCHEDULER_INTERVAL = 25;

function scheduler() {
  if (!isPlaying) return;
  const now = audioCtx.currentTime;
  const horizon = now + LOOK_AHEAD;

  while (eventIndex < DATA.events.length && DATA.events[eventIndex].time < horizon) {
    const event = DATA.events[eventIndex];
    if (event.time >= pauseOffset) {
      scheduleEvent(event, startTime + event.time);
    }
    eventIndex++;
  }

  if (eventIndex >= DATA.events.length) {
    const lastTime = DATA.events[DATA.events.length - 1].time;
    if (now > startTime + lastTime + 1) {
      stopPlayback();
    }
  }

  schedulerTimer = setTimeout(scheduler, SCHEDULER_INTERVAL);
}

// ==================== Playback Controls ====================
function startPlayback() {
  initAudio();
  if (isPlaying) return;
  isPlaying = true;
  startTime = audioCtx.currentTime - pauseOffset;
  eventIndex = 0;
  // Find first event after pauseOffset
  while (eventIndex < DATA.events.length && DATA.events[eventIndex].time < pauseOffset) {
    eventIndex++;
  }
  scheduler();
  updatePlayButton();
  animate();
}

function pausePlayback() {
  if (!isPlaying) return;
  isPlaying = false;
  pauseOffset = audioCtx.currentTime - startTime;
  clearTimeout(schedulerTimer);
  scheduledNodes.forEach(n => { try { n.stop(); } catch(e){} });
  scheduledNodes = [];
  updatePlayButton();
}

function stopPlayback() {
  isPlaying = false;
  pauseOffset = 0;
  eventIndex = 0;
  clearTimeout(schedulerTimer);
  scheduledNodes.forEach(n => { try { n.stop(); } catch(e){} });
  scheduledNodes = [];
  updatePlayButton();
  updateUI(0);
}

function seekTo(ratio) {
  const newTime = ratio * DATA.total_duration;
  const wasPlaying = isPlaying;
  if (isPlaying) pausePlayback();
  pauseOffset = newTime;
  if (wasPlaying) startPlayback();
  else updateUI(newTime);
}

function updatePlayButton() {
  document.getElementById("playBtn").innerHTML = isPlaying ? "&#10074;&#10074;" : "&#9654;";
}

// ==================== Visualization ====================
const canvas = document.getElementById("pianoRoll");
const ctx2d = canvas.getContext("2d");

let allNotes = [];
DATA.events.forEach(e => {
  if (e.notes) allNotes = allNotes.concat(e.notes);
  if (e.note) allNotes.push(e.note);
});
const minNote = allNotes.length ? Math.min(...allNotes) - 2 : 36;
const maxNote = allNotes.length ? Math.max(...allNotes) + 2 : 84;
const noteRange = Math.max(12, maxNote - minNote);

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx2d.scale(dpr, dpr);
}
window.addEventListener("resize", () => { resizeCanvas(); drawPianoRoll(); });

function timeToX(t) {
  const w = canvas.getBoundingClientRect().width;
  return (t / DATA.total_duration) * w;
}

function noteToY(n) {
  const h = canvas.getBoundingClientRect().height;
  return h - ((n - minNote) / noteRange) * h;
}

function drawPianoRoll() {
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;
  ctx2d.clearRect(0, 0, w, h);

  // Background grid
  ctx2d.strokeStyle = "rgba(48,54,61,0.3)";
  ctx2d.lineWidth = 0.5;
  DATA.sections.forEach(s => {
    const x = timeToX(s.start_time);
    ctx2d.beginPath();
    ctx2d.moveTo(x, 0);
    ctx2d.lineTo(x, h);
    ctx2d.stroke();
  });

  // Draw events
  const currentTime = isPlaying ? (audioCtx.currentTime - startTime) : pauseOffset;

  DATA.events.forEach(e => {
    if (e.time > currentTime + 0.5) return; // only draw near-future
    const x = timeToX(e.time);
    const dur = e.duration || 0.1;
    const noteW = Math.max(2, timeToX(dur) - timeToX(0));
    let color, y, height;

    if (e.type === "chord" && e.notes) {
      color = "rgba(56,139,253,0.6)";
      e.notes.forEach(n => {
        y = noteToY(n);
        ctx2d.fillStyle = color;
        ctx2d.fillRect(x, y - 2, noteW, 4);
      });
    } else if (e.type === "melody" && e.note != null) {
      color = "rgba(216,90,48,0.8)";
      y = noteToY(e.note);
      ctx2d.fillStyle = color;
      ctx2d.fillRect(x, y - 3, noteW, 6);
    } else if (e.type === "bass" && e.note != null) {
      color = "rgba(29,158,117,0.5)";
      y = noteToY(e.note);
      ctx2d.fillStyle = color;
      ctx2d.fillRect(x, y - 2, noteW, 4);
    } else if (e.type === "kick") {
      ctx2d.fillStyle = "rgba(139,148,158,0.4)";
      ctx2d.beginPath();
      ctx2d.arc(x, h - 8, 3, 0, Math.PI * 2);
      ctx2d.fill();
    } else if (e.type === "snare") {
      ctx2d.fillStyle = "rgba(139,148,158,0.3)";
      ctx2d.beginPath();
      ctx2d.arc(x, h - 14, 2.5, 0, Math.PI * 2);
      ctx2d.fill();
    } else if (e.type === "hihat") {
      ctx2d.fillStyle = "rgba(139,148,158,0.2)";
      ctx2d.beginPath();
      ctx2d.arc(x, h - 20, 1.5, 0, Math.PI * 2);
      ctx2d.fill();
    }
  });

  // Playhead
  if (currentTime > 0 && currentTime < DATA.total_duration) {
    const px = timeToX(currentTime);
    ctx2d.strokeStyle = "rgba(255,255,255,0.8)";
    ctx2d.lineWidth = 1.5;
    ctx2d.beginPath();
    ctx2d.moveTo(px, 0);
    ctx2d.lineTo(px, h);
    ctx2d.stroke();
  }
}

// ==================== Lyrics & UI Update ====================
function getCurrentSection(time) {
  for (let i = DATA.sections.length - 1; i >= 0; i--) {
    if (time >= DATA.sections[i].start_time) return DATA.sections[i];
  }
  return DATA.sections[0];
}

function updateUI(time) {
  // Time display
  const fmt = t => Math.floor(t/60) + ":" + String(Math.floor(t%60)).padStart(2,"0");
  document.getElementById("timeDisplay").textContent = fmt(time) + " / " + fmt(DATA.total_duration);

  // Seek bar
  document.getElementById("seekBar").value = (time / DATA.total_duration * 1000) || 0;

  // Section label
  const section = getCurrentSection(time);
  document.getElementById("sectionLabel").textContent = section ? section.label : "";

  // Section nav highlight
  document.querySelectorAll(".section-btn").forEach((btn, i) => {
    btn.classList.toggle("active", DATA.sections[i] === section);
  });

  // Lyrics
  const lyricsDiv = document.getElementById("lyricsDisplay");
  if (section && section.lyrics.length > 0) {
    const sectionTime = time - section.start_time;
    const lineDur = section.duration / section.lyrics.length;
    const lineIdx = Math.min(section.lyrics.length - 1, Math.floor(sectionTime / lineDur));

    lyricsDiv.innerHTML = "";
    const start = Math.max(0, lineIdx - 1);
    const end = Math.min(section.lyrics.length - 1, lineIdx + 1);
    for (let i = start; i <= end; i++) {
      const div = document.createElement("div");
      div.className = "lyric-line " + (i === lineIdx ? "lyric-current" : i === lineIdx - 1 || i === lineIdx + 1 ? "lyric-near" : "lyric-far");
      div.textContent = section.lyrics[i];
      lyricsDiv.appendChild(div);
    }
  } else {
    lyricsDiv.innerHTML = '<div class="lyric-line lyric-far">(instrumental)</div>';
  }
}

function animate() {
  if (!isPlaying) return;
  const currentTime = audioCtx.currentTime - startTime;
  if (currentTime >= DATA.total_duration) {
    stopPlayback();
    return;
  }
  drawPianoRoll();
  updateUI(currentTime);
  requestAnimationFrame(animate);
}

// ==================== Section Navigation ====================
function buildSectionNav() {
  const nav = document.getElementById("sectionsNav");
  nav.innerHTML = "";
  DATA.sections.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "section-btn";
    btn.textContent = s.label;
    btn.onclick = () => seekTo(s.start_time / DATA.total_duration);
    nav.appendChild(btn);
  });
}

// ==================== Event Listeners ====================
document.getElementById("playBtn").onclick = () => {
  if (isPlaying) pausePlayback();
  else startPlayback();
};

document.getElementById("stopBtn").onclick = stopPlayback;

document.getElementById("seekBar").oninput = (e) => {
  seekTo(e.target.value / 1000);
};

// Keyboard
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (isPlaying) pausePlayback(); else startPlayback(); }
});

// ==================== Init ====================
resizeCanvas();
buildSectionNav();
updateUI(0);
drawPianoRoll();
</script>
</body>
</html>
