signals:
  悬念:
  - 章末留未解身份或动机
  - 关键道具计数与人数错位
  反转:
  - 看似自杀实为他杀
  - 失踪者并未死亡
  危机:
  - 封闭空间再添一具尸体
  - 唯一武器/通讯手段失窃
  期待:
  - 童谣下一句预示下一死法
  - 幸存者即将揭穿真凶
  冲突:
  - 两派人马互扣凶手帽子
  - 权威人物被迫自证清白
  情感:
  - 过往罪行被公开审判
  - 临死前的忏悔或拒认
  幽默:
  - 紧张中插入黑色讽刺对白
  - 荒诞情境下的冷面调侃
  新奇:
  - 童谣与杀人手法严丝合缝
  - 全知音频指控打破第四面墙
