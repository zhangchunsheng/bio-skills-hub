<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动图学生物—高中生物交互学习实验室 · 离线版（全中文 · 可商用）</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --accent:#6366f1; --accent2:#06b6d4;
    --good:#10b981; --gold:#f59e0b; --shadow:0 8px 28px rgba(31,41,55,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:var(--accent);text-decoration:none}
  .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(110deg,var(--accent),var(--accent2));color:#fff;
    padding:12px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
  .topbar h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.5px}
  .topbar .tag{font-size:12px;opacity:.9}
  .topbar .spacer{flex:1}
  .stat{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
  .progress-wrap{min-width:160px}
  .progress-track{height:8px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden;margin-top:4px}
  .progress-fill{height:100%;width:0;background:#fff;transition:width .4s ease}
  .search{background:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:14px;width:200px;outline:none;color:var(--ink)}
  .layout{display:flex;min-height:calc(100vh - 64px)}
  .sidebar{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 64px);position:sticky;top:64px}
  .sidebar .sb-head{padding:14px 16px;font-weight:800;color:var(--muted);font-size:13px;letter-spacing:1px}
  .vol{padding:8px 12px}
  .vol-name{font-weight:800;font-size:14px;padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .vol-name .dot{width:10px;height:10px;border-radius:50%}
  .chap{padding:6px 10px 6px 24px}
  .chap-name{font-size:13px;color:var(--ink);cursor:pointer;padding:6px 8px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
  .chap-name:hover{background:var(--bg)}
  .chap-name.active{background:linear-gradient(110deg,rgba(99,102,241,.12),rgba(6,182,212,.12));font-weight:700}
  .badge{font-size:11px;background:var(--bg);color:var(--muted);border-radius:999px;padding:1px 8px}
  .main{flex:1;padding:22px 28px;overflow-x:hidden}
  .hero{background:linear-gradient(120deg,#eef2ff,#ecfeff);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);margin-bottom:20px}
  .hero h2{margin:0 0 6px;font-size:22px}
  .hero p{margin:0;color:var(--muted);font-size:14px}
  .vol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}
  .vol-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
  .vol-card:hover{transform:translateY(-3px)}
  .vol-card .vc-top{display:flex;align-items:center;gap:10px;font-weight:800}
  .vol-card .vc-bar{height:6px;background:var(--bg);border-radius:999px;margin:12px 0 6px;overflow:hidden}
  .vol-card .vc-bar i{display:block;height:100%;border-radius:999px}
  .vol-card small{color:var(--muted)}
  .chap-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .chap-head .pill{font-size:12px;font-weight:800;color:#fff;border-radius:999px;padding:4px 12px}
  .chap-head h2{margin:0;font-size:22px}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin:16px 0}
  .sec.learned{border-color:var(--good)}
  .sec-top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
  .sec h3{margin:0 0 4px;font-size:17px}
  .sec .pts{margin:10px 0;padding-left:0;list-style:none}
  .sec .pts li{position:relative;padding:4px 0 4px 22px;font-size:14px;color:#374151}
  .sec .pts li:before{content:"▹";position:absolute;left:4px;color:var(--accent)}
  .formula{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px 14px;margin:10px 0;font-family:"Cambria","Times New Roman",serif;font-size:16px;overflow-x:auto}
  .formula b{color:#fbbf24}
  .sim-box{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:10px;background:#fafbff}
  .sim-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .btn{border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:filter .15s}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:#eef2ff;color:var(--accent)}
  .btn.green{background:var(--good)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .learned-flag{font-size:12px;font-weight:800;color:var(--good);display:none}
  .sec.learned .learned-flag{display:inline}
  .sec.learned .btn.green{background:var(--good);opacity:.85}
  .cv-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .cv-box{flex:1;min-width:300px}
  canvas{background:#0b1220;border-radius:10px;width:100%;display:block}
  .ctl{display:flex;flex-direction:column;gap:8px;min-width:210px}
  .ctl label{font-size:13px;color:#374151;display:flex;justify-content:space-between}
  .ctl input[type=range]{width:100%}
  .ctl select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);font-size:13px}
  .readout{font-size:13px;color:#0f172a;background:#ecfeff;border-radius:8px;padding:6px 10px;margin-top:6px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(40px);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.35s;z-index:60;box-shadow:var(--shadow)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .lic-note{font-size:12px;color:var(--muted);background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin-top:10px}
  @media(max-width:880px){.sidebar{display:none}.main{padding:16px}.search{width:140px}}

.quiz-head{font-size:14px;font-weight:700;color:#4f46e5;margin:14px 0 4px;padding:6px 0;border-top:1px dashed #e5e7eb}
.quiz-card{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin:10px 0}
.quiz-q{font-weight:700;margin:10px 0 6px;font-size:14px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer;color:#1f2937;transition:.12s}
.opt:hover{background:#eef2ff;border-color:#c7d2fe}
.opt.ok{background:#dcfce7;border-color:#86efac;color:#166534}
.opt.no{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.quiz-fb{margin:8px 0 2px;font-size:13px;line-height:1.65;color:#374151;background:#fff;border-left:3px solid #6366f1;padding:8px 12px;border-radius:0 8px 8px 0}
.voicebtn{background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
.voicebtn:hover{background:#e0e7ff}
.voicebtn.mini{margin-top:6px}

</style>
</head>

<script>
/* ============ 课程数据：人教版 高中生物（2019版） ============
   每个知识点均配有「原创、自包含、离线、全中文」的交互仿真（kind 对应下方 SIMS 注册表）。
   无任何外部网络依赖、不调用任何第三方在线资源，全部动画代码为本应用原创，可商用。
*/
const S = (k)=>({t:'sim', kind:k});
const NONE = ()=>({t:'sim', kind:'none'});

const CURRICULUM = [
 { id:'b1', name:'必修一 分子与细胞', color:'#10b981', chapters:[
   { name:'第1章 走近细胞', sections:[
     { title:'细胞学说及其建立', pts:['细胞是生物体结构和功能的基本单位','细胞学说：一切动植物由细胞发育而来','新细胞由老细胞分裂产生','魏尔肖提出"细胞来自细胞"'],
       f:['细胞学说揭示<b>统一性</b>'], sim:NONE() },
     { title:'细胞的多样性和统一性', pts:['原核细胞无核膜包被的细胞核','真核细胞有真正的细胞核','蓝细菌（蓝藻）含叶绿素能光合作用','原核与真核均以 DNA 为遗传物质'],
       f:['原核：<b>无核膜</b> 有拟核','真核：<b>有核膜</b>'], sim:NONE() },

     { title:'蛋白质——生命活动的主要承担者', pts:['蛋白质是生命活动的主要承担者','基本单位：氨基酸（约20种）','氨基酸通过肽键连接成多肽','结构多样性决定功能多样性','高温使蛋白质变性空间结构破坏'],
       f:['脱水缩合：<b>肽键 = −NH−CO−</b>','m个氨基酸→n条肽链：肽键数=m−n'], sim:NONE() },
     { title:'核酸——遗传信息的携带者', pts:['核酸包括 DNA 与 RNA','DNA 主要分布细胞核，RNA 主要在细胞质','核苷酸是核酸的基本单位','核苷酸由五碳糖+磷酸+含氮碱基组成'],
       f:['DNA 含碱基 <b>A T G C</b>','RNA 含碱基 A U G C'], sim:NONE() },
     { title:'糖类和脂质', pts:['糖类是主要能源物质','单糖（葡萄糖）、二糖、多糖（淀粉/糖原/纤维素）','脂肪是良好储能物质','磷脂构成生物膜','固醇包括胆固醇、性激素、VD'],
       f:['葡萄糖 <b>C₆H₁₂O₆</b>','淀粉是植物储能多糖'], sim:NONE() },
     { title:'无机物——水和无机盐', pts:['水在细胞中有自由水和结合水','自由水比例高代谢旺盛','无机盐大多以离子形式存在','Fe 是血红蛋白成分，Mg 是叶绿素成分'],
       f:['自由水 / 结合水 比值影响代谢'], sim:NONE() },
     { title:'检测生物组织中的化合物', pts:['还原糖与斐林试剂水浴生成砖红色沉淀','脂肪被苏丹Ⅲ染成橘黄色','蛋白质与双缩脲试剂呈紫色','淀粉遇碘变蓝'],
       f:['还原糖 + 斐林试剂 → <b>砖红</b>'], sim:NONE() },
   ]},
   { name:'第3章 细胞的基本结构', sections:[
     { title:'细胞膜的结构和功能', pts:['细胞膜将细胞与外界分隔开','控制物质进出细胞','进行细胞间信息交流','磷脂双分子层构成基本支架','蛋白质以不同方式镶嵌其中（流动镶嵌模型）'],
       f:['流动镶嵌模型：<b>磷脂双分子层</b>+蛋白质'], sim:S('membrane') },
     { title:'细胞器之间的分工合作', pts:['线粒体是有氧呼吸主要场所','内质网是蛋白质加工、脂质合成场所','高尔基体参与分泌、植物细胞壁形成','溶酶体含多种水解酶','核糖体是蛋白质合成场所','生物膜系统协调配合'],
       f:['分泌蛋白：核糖体→内质网→高尔基体'], sim:NONE() },
     { title:'细胞核的结构和功能', pts:['细胞核是遗传信息库','核膜为双层膜，有核孔','核仁与 rRNA、核糖体形成有关','染色质由 DNA 和蛋白质组成','细胞代谢的控制中心'],
       f:['染色体 = DNA + 蛋白质（间期=<b>染色质</b>）'], sim:NONE() },
   ]},
   { name:'第4章 细胞的物质输入和输出', sections:[
     { title:'水进出细胞的原理（渗透作用）', pts:['半透膜两侧浓度差导致渗透','外界溶液浓度>细胞质壁分离','外界溶液浓度<细胞质壁分离复原','成熟植物细胞发生质壁分离','动物细胞吸水涨破/失水皱缩'],
       f:['渗透：水从 <b>低渗</b> → <b>高渗</b>'], sim:S('transport') },
     { title:'主动运输与胞吞、胞吐', pts:['自由扩散顺浓度梯度不需载体','协助扩散需载体不耗能','主动运输逆浓度梯度需载体和能量','大分子通过胞吞、胞吐进出','胞吞胞吐依赖膜的流动性'],
       f:['主动运输：<b>逆梯度+载体+ATP</b>'], sim:S('transport') },
   ]},
   { name:'第5章 细胞的能量供应和利用', sections:[

       f:['酶降低 <b>活化能 Eₐ</b> 加快反应'], sim:S('enzyme') },
     { title:'细胞的能量"货币"ATP', pts:['ATP 是生物体直接能源物质','ATP 结构：A−P~P~P','远离 A 的高能磷酸键易水解','ATP 与 ADP 快速相互转化','光合作用和细胞呼吸均合成 ATP'],
       f:['ATP ⇌ ADP + Pi + 能量'], sim:NONE() },
     { title:'细胞呼吸的原理和应用', pts:['有氧呼吸分三阶段释放大量能量','第一阶段在细胞质基质','第二、三阶段在线粒体','产物为 CO₂ 和 H₂O','无氧呼吸产物为乳酸或酒精和 CO₂','葡萄糖是主要呼吸底物'],
       f:['C₆H₁₂O₆+6O₂→<b>6CO₂+6H₂O+能量</b>'], sim:S('respiration') },
     { title:'光合作用与能量转化', pts:['光合色素吸收红光和蓝紫光','光反应在类囊体薄膜产生 ATP/NADPH/O₂','暗反应在叶绿体基质固定 CO₂','卡尔文循环生成糖类','光照和 CO₂ 影响光合速率','光合作用是能量来源和碳氧平衡基础'],
       f:['6CO₂+12H₂O→<b>C₆H₁₂O₆+6O₂+6H₂O</b>'], sim:S('photosynthesis') },
   ]},
   { name:'第6章 细胞的生命历程', sections:[
     { title:'细胞增殖——有丝分裂', pts:['细胞周期包括间期和分裂期','间期完成 DNA 复制和有关蛋白质合成','前期核膜核仁消失、染色体出现','中期染色体排列在赤道板','后期着丝点分裂姐妹染色单体分开','末期细胞一分为二，染色体数不变'],
       f:['有丝分裂保持 <b>亲子代染色体数恒定</b>'], sim:S('mitosis') },
     { title:'细胞的分化、衰老和凋亡', pts:['细胞分化使细胞趋向专门化','基因选择性表达导致分化','细胞全能性：已分化细胞仍有全套遗传信息','衰老细胞水分减少、酶活性降低','细胞凋亡由基因决定（程序性死亡）'],
       f:['分化本质：<b>基因选择性表达</b>'], sim:NONE() },
     { title:'细胞的癌变', pts:['癌细胞能无限增殖','形态结构发生显著变化','细胞膜糖蛋白减少易分散转移','原癌基因和抑癌基因发生突变','致癌因子分物理、化学、病毒三类'],
       f:['癌变：<b>原癌基因+抑癌基因突变</b>'], sim:S('mutation') },
   ]},
 ]},

 { id:'b2', name:'必修二 遗传与进化', color:'#6366f1', chapters:[
   { name:'第1章 遗传因子的发现', sections:[
     { title:'孟德尔的豌豆杂交实验（一）——分离定律', pts:['孟德尔用豌豆作材料，人工杂交','提出"遗传因子"假说','F₁ 只表现显性性状','F₂ 出现 3:1 性状分离比','分离定律：等位基因随同源染色体分开而分离'],
       f:['F₂ 表型比 <b>3 : 1</b>','Aa × Aa → 1AA:2Aa:1aa'], sim:S('mendel1') },
     { title:'孟德尔的豌豆杂交实验（二）——自由组合定律', pts:['两对相对性状独立遗传','F₁ 为双杂合子（YyRr）','F₂ 表型比 9:3:3:1','自由组合定律：非同源染色体上的非等位基因自由组合','先分离后组合'],
       f:['F₂ 表型比 <b>9 : 3 : 3 : 1</b>'], sim:S('mendel2') },
   ]},
   { name:'第2章 基因和染色体的关系', sections:[
     { title:'减数分裂和受精作用', pts:['减数分裂染色体复制一次、分裂两次','同源染色体联会形成四分体','减数第一次分裂同源染色体分离','减数第二次分裂姐妹染色单体分开','配子染色体数为体细胞一半','受精作用恢复染色体数目'],
       f:['配子染色体数 = 体细胞 <b>一半</b>'], sim:S('meiosis') },
     { title:'基因在染色体上', pts:['萨顿提出基因在染色体上（类比推理）','摩尔根用果蝇证明基因在染色体上','白眼基因位于 X 染色体','一条染色体上有许多基因','基因在染色体上呈线性排列'],
       f:['摩尔根：<b>基因位于染色体上</b>'], sim:S('linkage') },
     { title:'伴性遗传', pts:['伴 X 隐性：男性患者多于女性','红绿色盲为伴 X 隐性遗传','抗维生素 D 佝偻病为伴 X 显性','伴 Y 遗传只传男','位于性染色体上的基因随性染色体传递'],
       f:['伴X隐性：<b>交叉遗传</b>'], sim:S('linkage') },
   ]},
   { name:'第3章 基因的本质', sections:[
     { title:'DNA是主要的遗传物质', pts:['格里菲思肺炎链球菌转化实验','艾弗里证明 DNA 是转化因子','噬菌体侵染实验证明 DNA 是遗传物质','少数病毒以 RNA 为遗传物质','"主要"因多数生物遗传物质是 DNA'],
       f:['DNA 是 <b>主要遗传物质</b>'], sim:NONE() },

/* ============ 通用画布/控件助手 ============ */
function alive(cv){return cv && document.body.contains(cv);}
function gv(id){var e=document.getElementById(id);return e?parseFloat(e.value):0;}
function st(id,t){var e=document.getElementById(id);if(e)e.textContent=t;}
function mount(id,w,h,ctl){
  const m=document.getElementById(id); if(!m) return null;
  m.innerHTML=`<div class="cv-wrap"><div class="cv-box"><canvas id="${id}c" width="${w}" height="${h}"></canvas></div><div class="ctl">${ctl}</div></div>`;
  const cv=document.getElementById(id+'c');
  const ctx=cv?cv.getContext('2d'):null;
  return ctx?{cv:cv,ctx:ctx,w:w,h:h}:null;
}
function slider(id,label,min,max,val,unit){unit=unit||'';return `<label>${label} <span id="${id}v">${val}</span> ${unit}</label><input type="range" id="${id}" min="${min}" max="${max}" value="${val}">`;}
function sel(id,label,opts){var o=opts.map(x=>`<option value="${x.v}">${x.t}</option>`).join('');return `<label>${label}</label><select id="${id}">${o}</select>`;}
function arrow(ctx,x1,y1,x2,y2,color,wd){
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=wd||2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),s=7;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4));
  ctx.lineTo(x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function txt(ctx,s,x,y,color,size){ctx.fillStyle=color||'#e2e8f0';ctx.font=(size||12)+'px sans-serif';ctx.fillText(s,x,y);}

/* ============ 画布仿真注册表（全部原创、离线、中文） ============ */
function buildCustom(mountId, kind){

  else { const m=document.getElementById(mountId); if(m) m.innerHTML='<div class="sim-meta">📖 本节以概念与公式讲解为主。</div>'; }
}

/* ---------- 细胞膜：流动镶嵌模型 ---------- */
function buildMembrane(id){
  const p=mount(id,440,300,slider(id+'-T','温度',0,60,37,'°C')+slider(id+'-chol','胆固醇比例',0,100,40,'%')+'<div class="readout" id="'+id+'-r"></div>');
  if(!p)return; const {cv,ctx}=p; let t=0;
  const lips=[]; for(let i=0;i<22;i++){lips.push({x:20+i*20,y:130});}
  (function draw(){
    if(!alive(cv))return;
    const T=gv(id+'-T'),chol=gv(id+'-chol'); st(id+'-T'+'v',T); st(id+'-chol'+'v',chol);
    const speed=(T-37)*0.003 + 0.01;
    ctx.clearRect(0,0,440,300);
    ctx.fillStyle='rgba(16,185,129,.08)'; ctx.fillRect(0,118,440,84);
    for(let i=0;i<lips.length;i++){const l=lips[i]; l.x+=speed; if(l.x>440)l.x-=440;
      ctx.fillStyle='#f59e0b'; ctx.beginPath();ctx.arc(l.x,126,7,0,7);ctx.fill();
      ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(l.x,133);ctx.lineTo(l.x,158);ctx.stroke();
      ctx.fillStyle='#f59e0b'; ctx.beginPath();ctx.arc(l.x,194,7,0,7);ctx.fill();
      ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(l.x,187);ctx.lineTo(l.x,162);ctx.stroke();
    }
    ctx.fillStyle='#6366f1'; ctx.fillRect(120,108,22,124);
    ctx.fillStyle='#06b6d4'; ctx.fillRect(300,140,18,60);
    txt(ctx,'整合蛋白',108,104,'#6366f1',11);
    txt(ctx,'外周蛋白',298,134,'#06b6d4',11);
    let note = T>45?'流动性过高，膜不稳定':(T<10?'流动性过低，膜变僵硬':'流动性适中');
    st(id+'-r','磷脂双分子层构成基本支架，蛋白质镶嵌/贯穿；' + T + '°C ' + note + '；胆固醇比例 ' + chol + '%');
    t+=0.02;
    requestAnimationFrame(draw);
  })();
}

/* ---------- 物质跨膜运输 ---------- */
function buildTransport(id){
  const p=mount(id,440,300,sel(id+'-mode','运输方式',[{v:'free',t:'自由扩散'},{v:'fac',t:'协助扩散'},{v:'active',t:'主动运输'}])+slider(id+'-conc','膜外浓度',10,100,80,'%')+'<div class="readout" id="'+id+'-r"></div>');
  if(!p)return; const {cv,ctx}=p;
  const parts=[];
  for(let i=0;i<30;i++){parts.push({x:Math.random()*440,y:Math.random()*260+20,vx:(Math.random()-0.5)*0.6});}
  (function draw(){
    if(!alive(cv))return;
    const mode=document.getElementById(id+'-mode').value;
    const conc=gv(id+'-conc'); st(id+'-conc'+'v',conc);
    const dir=(mode==='active')?1:-1;
    ctx.clearRect(0,0,440,300);
    ctx.fillStyle='#1e293b'; ctx.fillRect(217,0,8,300);
    if(mode!=='free'){ ctx.fillStyle='#6366f1'; ctx.fillRect(217,118,8,64); }
    for(const pt of parts){
      pt.x += pt.vx + dir*0.25;
      if(pt.x>215 && pt.x<225){
        const through=(mode==='free')||(pt.y>118&&pt.y<182);
        if(!through){ pt.vx*=-1; pt.x+=pt.vx; }
      }
      if(pt.x<8){pt.x=8;pt.vx*=-1;} if(pt.x>432){pt.x=432;pt.vx*=-1;}
      ctx.fillStyle = mode==='active'?'#ef4444':'#38bdf8';
      ctx.beginPath();ctx.arc(pt.x,pt.y,4,0,7);ctx.fill();
    }
    txt(ctx,'膜外(高浓)',250,30,'#cbd5e1',11);
    txt(ctx,'膜内',20,30,'#cbd5e1',11);
    let note;
    if(mode==='free') note='自由扩散：顺浓度梯度，不需载体、不耗能（如 O₂、CO₂）';
    else if(mode==='fac') note='协助扩散：顺浓度梯度，需通道蛋白、不耗能（如葡萄糖进红细胞）';
    else note='主动运输：逆浓度梯度，需载体并消耗 ATP（如 Na⁺/K⁺ 泵）';
    st(id+'-r',note);
    requestAnimationFrame(draw);
  })();
}

/* ---------- 酶活性（温度/pH 曲线） ---------- */
function buildEnzyme(id){
  const p=mount(id,440,300,slider(id+'-T','温度',0,90,37,'°C')+slider(id+'-pH','pH',1,14,7,'')+'<div class="readout" id="'+id+'-r"></div>');
  if(!p)return; const {cv,ctx}=p; let t=0;
  (function draw(){
    if(!alive(cv))return;
    const T=gv(id+'-T'),pH=gv(id+'-pH'); st(id+'-T'+'v',T); st(id+'-pH'+'v',pH);
    const aT=Math.exp(-Math.pow((T-37)/15,2));
    const aP=Math.exp(-Math.pow((pH-7)/2.5,2));
    const act=aT*aP*100;
    const denat = T>60;
    ctx.clearRect(0,0,440,300);
    ctx.strokeStyle='#475569';ctx.beginPath();ctx.moveTo(40,260);ctx.lineTo(420,260);ctx.moveTo(40,260);ctx.lineTo(40,40);ctx.stroke();
    ctx.strokeStyle='#38bdf8';ctx.beginPath();
    for(let i=0;i<=80;i++){const tt=0+i*90/80;const a=Math.exp(-Math.pow((tt-37)/15,2));const gx=40+tt*4;const gy=260-a*200;if(i===0)ctx.moveTo(gx,gy);else ctx.lineTo(gx,gy);}
    ctx.stroke();
    ctx.strokeStyle='#f59e0b';ctx.beginPath();
    for(let i=0;i<=80;i++){const pp=1+i*13/80;const a=Math.exp(-Math.pow((pp-7)/2.5,2));const gx=40+pp*28;const gy=260-a*200;if(i===0)ctx.moveTo(gx,gy);else ctx.lineTo(gx,gy);}
    ctx.stroke();
    ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(40+T*4,260-act/100*200,5,0,7);ctx.fill();
    txt(ctx,'蓝：温度→活性 (最适≈37℃)',60,55,'#38bdf8',11);
    txt(ctx,'橙：pH→活性 (最适≈7)',60,72,'#f59e0b',11);
    st(id+'-r','当前活性≈'+act.toFixed(0)+'%  '+(denat?'高温使酶空间结构破坏而失活':'适宜范围内活性随温度升高而增强'));
    t+=0.02;
    requestAnimationFrame(draw);
  })();
}

/* ---------- 有丝分裂 ---------- */
function buildMitosis(id){
  const p=mount(id,440,320,sel(id+'-phase','时期',[{v:'inter',t:'间期'},{v:'pro',t:'前期'},{v:'meta',t:'中期'},{v:'ana',t:'后期'},{v:'tel',t:'末期'}])+'<div class="readout" id="'+id+'-r"></div>');
  if(!p)return; const {cv,ctx}=p; let t=0;
  function drawChrom(x,y,rot,col){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
    ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-4,-26);ctx.lineTo(-4,26);ctx.moveTo(4,-26);ctx.lineTo(4,26);ctx.stroke();
    ctx.restore();
  }
  (function draw(){
    if(!alive(cv))return;
    const ph=document.getElementById(id+'-phase').value;
    ctx.clearRect(0,0,440,320);
    ctx.strokeStyle='#475569';ctx.beginPath();ctx.arc(220,160,120,0,7);ctx.stroke();
    if(ph!=='inter'){ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(220,160);ctx.lineTo(120,160);ctx.moveTo(220,160);ctx.lineTo(320,160);ctx.stroke();}
    let desc='';
    if(ph==='inter'){ desc='间期：DNA复制，每条染色体含2条姐妹染色单体（染色体数2n）'; drawChrom(220,160,0,'#6366f1'); }
    else if(ph==='pro'){ desc='前期：核膜核仁消失，染色体螺旋化、缩短变粗'; drawChrom(175,135,0.35,'#6366f1'); drawChrom(265,185,-0.25,'#6366f1'); }
    else if(ph==='meta'){ desc='中期：着丝点排列在赤道板上（观察染色体最佳时期）'; drawChrom(220,160,0,'#6366f1'); }
    else if(ph==='ana'){ desc='后期：着丝点分裂，姐妹染色单体移向两极'; drawChrom(135,160,0,'#06b6d4'); drawChrom(305,160,0,'#ef4444'); }
    else { desc='末期：细胞一分为二，形成两个子细胞（染色体数2n）'; ctx.beginPath();ctx.arc(150,160,70,0,7);ctx.arc(290,160,70,0,7);ctx.stroke(); drawChrom(150,160,0,'#6366f1'); drawChrom(290,160,0,'#6366f1'); }
    st(id+'-r',desc);
    t+=0.02;
    requestAnimationFrame(draw);
  })();
}

/* ---------- 减数分裂 ---------- */
function buildMeiosis(id){

  if(!p)return; const {cv,ctx}=p; let t=0;
  function ch(x,y,col){ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,y-18);ctx.lineTo(x,y+18);ctx.stroke();}
  (function draw(){
    if(!alive(cv))return;
    const stg=document.getElementById(id+'-stage').value;
    ctx.clearRect(0,0,440,340);
    ctx.strokeStyle='#475569';ctx.beginPath();ctx.arc(220,170,140,0,7);ctx.stroke();

function buildDna(id){

}

/* ---------- 突触传递 ---------- */
function buildSynapse(id){

  if(!p)return; const {cv,ctx}=p; let t=0;
  const ves=[]; for(let i=0;i<6;i++)ves.push({y:60+i*14,rel:false});
  (function draw(){
    if(!alive(cv))return;
    const r=gv(id+'-rate'); st(id+'-rate'+'v',r);
    ctx.clearRect(0,0,440,300);
    // 突触前膜
    ctx.strokeStyle='#6366f1';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(40,160);ctx.lineTo(200,160);ctx.stroke();
    ctx.fillStyle='rgba(99,102,241,.3)';ctx.fillRect(40,80,160,80);

    for(const vv of ves){ if((t* r)>vv.y/20 && !vv.rel){vv.rel=true;} ctx.fillStyle=vv.rel?'rgba(245,158,11,.3)':'#f59e0b';ctx.beginPath();ctx.arc(150,vv.y,7,0,7);ctx.fill(); if(vv.rel){vv.y+=3; if(vv.y>150)vv.rel=false;} }
    // 突触间隙

    txt(ctx,'突触后膜(受体)',250,52,'#10b981',11);
    // 神经递质穿过间隙
    for(let i=0;i<5;i++){const yy=160+((t*30*i)%100); ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(220+ (i*4),yy,3,0,7);ctx.fill();}
    if(t>20)t=0;
    st(id+'-r','突触前膜释放神经递质→扩散过间隙→与后膜受体结合，引发后膜电位变化（单向传递）');

/* ---------- 生长素两重性 / 向光性 ---------- */
function buildAuxin(id){
  const p=mount(id,440,300,slider(id+'-conc','生长素浓度',0,10,4,'（相对）')+'<div class="readout" id="'+id+'-r"></div>');
  if(!p)return; const {cv,ctx}=p; let t=0;
  (function draw(){
    if(!alive(cv))return;
    const c=gv(id+'-conc'); st(id+'-conc'+'v',c);
    // 两重性曲线：低促高抑（倒U）
    const eff = c<=5? c/5 : Math.max(0,1-(c-5)/5);
    ctx.clearRect(0,0,440,300);
    ctx.strokeStyle='#475569';ctx.beginPath();ctx.moveTo(40,260);ctx.lineTo(420,260);ctx.moveTo(40,260);ctx.lineTo(40,60);ctx.stroke();
    ctx.strokeStyle='#10b981';ctx.beginPath();
    for(let i=0;i<=100;i++){const cc=i/10; const e=cc<=5?cc/5:Math.max(0,1-(cc-5)/5);const gx=40+cc*36;const gy=260-e*180;if(i===0)ctx.moveTo(gx,gy);else ctx.lineTo(gx,gy);}
    ctx.stroke();
    ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(40+c*36,260-eff*180,5,0,7);ctx.fill();
    txt(ctx,'低浓度促进 / 高浓度抑制(两重性)',60,50,'#10b981',11);
    // 向光性茎弯曲
    const bend=Math.sin(t)*0.3 + c*0.05;
    ctx.strokeStyle='#6366f1';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(360,260);ctx.quadraticCurveTo(360-bend*40,160,360-bend*60,80);ctx.stroke();
    txt(ctx,'向光侧生长慢→弯曲',300,275,'#6366f1',11);
    st(id+'-r','浓度 '+c+'：效应 '+(eff*100).toFixed(0)+'%（>5 转为抑制）；单侧光使背光侧生长素多、生长快而致向光弯曲');
    t+=0.02;
    requestAnimationFrame(draw);
  })();
}

/* ---------- 种群增长（J形/S形） ---------- */
function buildPopulation(id){
  const p=mount(id,440,300,sel(id+'-mode','增长模型',[{v:'J',t:'J形增长(理想)'},{v:'S',t:'S形增长(现实)'}])+slider(id+'-K','环境容纳量K',50,300,200,'')+'<div class="readout" id="'+id+'-r"></div>');
  if(!p)return; const {cv,ctx}=p; let t=0;
  (function draw(){
    if(!alive(cv))return;
    const mode=document.getElementById(id+'-mode').value;
    const K=gv(id+'-K'); st(id+'-K'+'v',K);
    t+=0.01; if(t>12)t=0;
    ctx.clearRect(0,0,440,300);
    ctx.strokeStyle='#475569';ctx.beginPath();ctx.moveTo(40,260);ctx.lineTo(420,260);ctx.moveTo(40,260);ctx.lineTo(40,40);ctx.stroke();
    // K 线
    const ky=260-K/300*200;
    ctx.strokeStyle='#ef4444';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(40,ky);ctx.lineTo(420,ky);ctx.stroke();ctx.setLineDash([]);
    txt(ctx,'K='+K,360,ky-6,'#ef4444',11);
    // 曲线
    ctx.strokeStyle='#10b981';ctx.beginPath();
    for(let i=0;i<=200;i++){const tt=i/20; let N; if(mode==='J'){N=10*Math.exp(0.3*tt);}else{N=K/(1+((K-10)/10)*Math.exp(-0.3*tt));}
      const gx=40+tt*30; const gy=260-N/300*200; if(i===0)ctx.moveTo(gx,gy);else ctx.lineTo(gx,gy);}
    ctx.stroke();
    const Nt = mode==='J'? 10*Math.exp(0.3*t*20) : K/(1+((K-10)/10)*Math.exp(-0.3*t*20));
    const gx=40+t*20*30, gy=260-Math.min(Nt,300)/300*200;
    ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(gx,gy,4,0,7);ctx.fill();
    st(id+'-r',(mode==='J'?'J形：N=N₀λᵗ，无K限制':'S形：受K限制，K/2时增长最快')+'，当前 N≈'+Math.min(Nt,300).toFixed(0));
    requestAnimationFrame(draw);
  })();
}

/* ---------- 群落演替 ---------- */
function buildSuccession(id){
  const p=mount(id,460,280,slider(id+'-speed','演替速度',0,3,1,'')+'<div class="readout" id="'+id+'-r"></div>');
  if(!p)return; const {cv,ctx}=p; let t=0;
  const stages=['裸岩','地衣','苔藓','草本','灌木','森林'];
  (function draw(){
    if(!alive(cv))return;
    const sp=gv(id+'-speed'); st(id+'-speed'+'v',sp);
    const idx=Math.min(5,Math.floor(t)%6);
    t+=0.01*sp; if(t>6)t=0;
    ctx.clearRect(0,0,460,280);
    // 山石
    ctx.fillStyle='#64748b';ctx.beginPath();ctx.moveTo(40,240);ctx.lineTo(120,200);ctx.lineTo(220,240);ctx.fill();
    if(idx>=1){ctx.fillStyle='#94a3b8';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(60+i*25,220,5,0,7);ctx.fill();}}
    if(idx>=2){ctx.fillStyle='#10b981';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(60+i*30,210,8,0,7);ctx.fill();}}
    if(idx>=3){ctx.fillStyle='#22c55e';for(let i=0;i<6;i++){ctx.fillRect(55+i*30,170,4,40);}}
    if(idx>=4){ctx.fillStyle='#15803d';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(70+i*40,150,16,0,7);ctx.fill();}}
    if(idx>=5){ctx.fillStyle='#166534';ctx.beginPath();ctx.moveTo(200,80);ctx.lineTo(150,240);ctx.lineTo(250,240);ctx.fill();}
    txt(ctx,'当前阶段：'+stages[idx],40,40,'#e2e8f0',14);
    st(id+'-r','初生演替：'+stages.slice(0,idx+1).join(' → ')+'（结构由简单到复杂，物种丰富度增加）');
    requestAnimationFrame(draw);
  })();
}

/* ---------- 生态系统能量流动（金字塔） ---------- */
function buildEcosystem(id){
  const p=mount(id,460,300,slider(id+'-eff','传递效率',5,30,10,'%')+'<div class="readout" id="'+id+'-r"></div>');
  if(!p)return; const {cv,ctx}=p; let t=0;
  (function draw(){
    if(!alive(cv))return;
    const eff=gv(id+'-eff')/100; st(id+'-eff'+'v',(eff*100).toFixed(0));
    ctx.clearRect(0,0,460,300);
    const levels=['生产者','初级消费者','次级消费者','三级消费者'];
    let e=100; const xs=[];
    for(let i=0;i<4;i++){
      const w=Math.max(10,e/100*300);
      const x=(460-w)/2; xs.push(x);
      ctx.fillStyle=['#10b981','#22c55e','#f59e0b','#ef4444'][i];
      ctx.beginPath();
      ctx.moveTo(x,40+i*60);ctx.lineTo(x+w,40+i*60);ctx.lineTo(x+w*0.7+ (460-w*0.7)/2- w*0.15,80+i*60);ctx.lineTo((460-w*0.7)/2+w*0.15,80+i*60);ctx.closePath();ctx.fill();
      txt(ctx,levels[i]+' '+e.toFixed(0)+'%',x+10,65+i*60,'#fff',11);
      e=e*eff;
    }
    txt(ctx,'能量沿食物链单向流动、逐级递减',40,285,'#cbd5e1',11);
    st(id+'-r','相邻营养级传递效率≈'+(eff*100).toFixed(0)+'%（10%–20%）；能量金字塔不可倒置');
    t+=0.02;
    requestAnimationFrame(draw);
  })();
}

/* ---------- 碳循环 ---------- */
function buildCarboncycle(id){
  const p=mount(id,460,300,slider(id+'-co2','大气CO₂',0,10,5,'（相对）')+'<div class="readout" id="'+id+'-r"></div>');

    ctx.clearRect(0,0,460,300);
    // 大气
    ctx.fillStyle='rgba(99,102,241,.15)';ctx.fillRect(0,0,460,80);
    txt(ctx,'大气 CO₂',20,30,'#6366f1',13);
    // 植物
    ctx.fillStyle='#10b981';ctx.beginPath();ctx.moveTo(100,250);ctx.lineTo(70,250);ctx.lineTo(100,180);ctx.lineTo(130,250);ctx.fill();
    txt(ctx,'植物(生产者)',60,270,'#10b981',11);

    ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(260,230,18,0,7);ctx.fill();txt(ctx,'动物',255,260,'#f59e0b',11);
    // 土壤/化石
    ctx.fillStyle='#64748b';ctx.fillRect(0,270,460,30);txt(ctx,'土壤/化石燃料',20,290,'#e2e8f0',11);
    // 流动箭头 + 粒子

    t+=0.02;
    requestAnimationFrame(draw);

}

}

      if(!t) return false;
      t=decodeURIComponent(t).trim().toLowerCase();
      var s=null;
      for(var i=0;i<allSections.length;i++){
        var x=allSections[i];
        var hay=(x.title||'')+' '+(x._cname||'')+' '+(x._vname||'')+' '+((x.pts||[]).join(' '));

      if(!v) return false;
      var ci=0;
      for(var b=0;b<v.chapters.length;b++){ if(v.chapters[b].name===s._cname){ ci=b; break; } }
      renderChapter(v,ci);
      var secs=v.chapters[ci].sections, si=secs.indexOf(s);
      var run=function(){
        var box=document.getElementById('sim-'+si);
        if(box && !box.dataset.loaded) loadSim(si);
        var sec=document.getElementById('sec-'+si);
        if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});
      };
      if(window.requestAnimationFrame) window.requestAnimationFrame(run); else setTimeout(run,0);
      return true;
    }
    if(kp && openByTitle(kp)) return;
    if(q){ var sb=document.getElementById('search'); if(sb){ sb.value=decodeURIComponent(q); sb.dispatchEvent(new Event('input')); } }
  }catch(e){}
})();

function speak(text, btn){
  if(!('speechSynthesis' in window)){ if(btn) btn.textContent='🔇 当前环境不支持语音'; return; }
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.98; u.pitch=1;
    var vs=window.speechSynthesis.getVoices()||[];
    for(var i=0;i<vs.length;i++){ if(/zh|Chinese|中文/i.test(vs[i].lang||'')){ u.voice=vs[i]; break; } }
    if(btn){ var old=btn.textContent; btn.textContent='🔊 播放中…'; u.onend=function(){btn.textContent=old;}; u.onerror=function(){btn.textContent=old;}; }
    window.speechSynthesis.speak(u);
  }catch(e){ if(btn) btn.textContent='🔊 听讲解'; }
}
function buildTopicQuiz(container, title){
  if(!container) return;
  var qs = (window.QUIZ && window.QUIZ[title]) || (typeof QUIZ!=='undefined' && QUIZ[title]);
  if(!qs || !qs.length) return;
  var head=document.createElement('div'); head.className='quiz-head';
  head.innerHTML='📝 随堂测验（'+qs.length+' 题）· 答错先看错因，再听语音讲解';
  container.appendChild(head);
  qs.forEach(function(qd, idx){
    var box=document.createElement('div'); box.className='work quiz-card';
    var qt=document.createElement('div'); qt.className='quiz-q'; qt.innerHTML=(idx+1)+'. '+qd.q; box.appendChild(qt);
    var fb=document.createElement('div'); fb.className='quiz-fb'; fb.style.display='none';
    qd.opts.forEach(function(opt, oi){
      var b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=opt;
      b.addEventListener('click', function(){
        if(b.classList.contains('ok')||b.classList.contains('no')) return;
        var correct=(oi===qd.correct);
        b.classList.add(correct?'ok':'no');
        fb.style.display='block';
        if(correct){ fb.innerHTML='✅ 正确！'+qd.explain; }
        else {
          fb.innerHTML='❌ 正确选项：'+qd.opts[qd.correct]+'。'+(qd.why[oi]||'')+' '+qd.explain;
          var opts=box.querySelectorAll('.opt'); if(opts[qd.correct]) opts[qd.correct].classList.add('ok');
        }
      });
      box.appendChild(b);
    });
    var hear=document.createElement('button'); hear.className='voicebtn mini'; hear.type='button'; hear.textContent='🔊 听讲解';
    hear.addEventListener('click', function(){ speak(qd.q+'。'+(fb.textContent||qd.explain), hear); });
    box.appendChild(hear); box.appendChild(fb); container.appendChild(box);
  });
}

(function(){
  function inj(sec){
    if(sec.dataset.qz) return;
    var h3=sec.querySelector('h3'); if(!h3) return;
    sec.dataset.qz='1';
    buildTopicQuiz(sec, h3.textContent.trim());
  }
  function run(){ document.querySelectorAll('.sec').forEach(inj); }
  run();
  var _m=document.getElementById('main');
  if(_m){ try{ var _mo=new MutationObserver(run); _mo.observe(_m,{childList:true,subtree:true}); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', run);
})();
</script>
