description: >-
  搭建并运营「医疗AI情报台」：每日检索 PubMed 或官网 AI 产品公告，按影响因子与引用数筛选高质量医学 AI 文献与产品，
  生成结构化解读（背景 / 方法 / 测试验证 / 临床与商业化现状 / 相似 / 优势 / 局限），
  自动存档为 JSON、形成知识图谱，并生成可发布的单文件 HTML 看板（含内联力导知识图谱）。
  云端同步采用「采集驱动」（高频轮询 + 5 分钟守卫），确保只有当日采集产出后才自动上云，杜绝漏同步。
  内置可运行看板脚手架、字段规范与七步同步 SOP。
