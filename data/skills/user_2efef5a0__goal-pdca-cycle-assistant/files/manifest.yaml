description: '目标攻坚与PDCA循环复盘专家。引导用户通过多轮 PDCA（计划-执行-检查-改善）循环攻克复杂目标，自动将上一轮改善措施继承为下一轮计划，直至目标 100% 达成并输出结构化结案报告。不适用于一次性查询、闲聊、医疗/法律/金融决策、紧急危机干预。'
