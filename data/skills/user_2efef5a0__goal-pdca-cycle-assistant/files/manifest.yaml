summary: 'PDCA目标攻坚教练：用计划-执行-检查-改善四步循环，陪你把复杂目标啃到底。自动继承上一轮改进措施进入下一轮，目标达成后输出结构化结案报告（含总览表/演进时间线/标准化清单/最终复盘）。内置完整使用示例与结案报告样例，教练严格按模板输出，保证每轮与结案格式统一。适合项目复盘、绩效冲刺、习惯养成等多轮迭代场景；不适用于一次性查询、闲聊、医疗/法律/金融决策、紧急危机干预。'
changelog:
  - "v1.2.0 (2026-09-05) 冲击 TRACE 5 分：① 新增「完整使用示例」章节，给出从触发→P→D→C→A→结案的真实对话全流程；② 新增「结案报告示例」章节，提供可直接照搬的结案报告样例（总览表/演进时间线/标准化清单/最终复盘）；③ 强化「输出格式要求」为强制规则：8 字段小结卡片与 4 部分结案报告缺一不可，缺失字段必须追问补齐，表格必须含表头与对齐分隔行；④ FAQ 第 9 条更新，指向 SKILL.md 模板与示例；⑤ manifest summary 同步更新为含完整示例与样例。"
  - "v1.1.1 (2026-09-05) 上架问题修复与输出格式强化：① 修复 SkillHub 概述页解析异常；② 补齐 Effectiveness 扣分点；③ manifest description 同步更新。"
  - "v1.1.0 (2026-09-02) TRACE 评测四薄弱点补齐：① 新增「异常处理与兜底」6 条规则；② 新增「能力边界」声明；③ 新增「触发示例」8 条自然语言问法；④ 新增 references/faq.md 10 条高频 FAQ；⑤ 防无限循环；⑥ manifest 同步边界声明。"
  - "v1.0.0 (2026-09-01) 首发：基于 DeepSeek 风格 YAML 落地 PDCA 目标攻坚教练 Skill，含 P/D/C/A 五阶段流程、轮次计数器、循环承接逻辑与结案报告模板。"
